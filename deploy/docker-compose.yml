# Dentec ERP next to a self-hosted Supabase on the same Docker host (ZimaOS).
#
# 1. Find the network your Supabase stack runs on:
#      docker network ls        # usually "supabase_default"
# 2. Copy .env.example to .env next to this file and fill it in.
# 3. docker compose -f deploy/docker-compose.yml up -d --build
#
# The app talks to Supabase over the internal Docker network (http://kong:8000),
# so Supabase itself never has to be reachable from the internet — only this
# app does, through your Cloudflare tunnel.

services:
  dentec:
    build:
      context: ..
    image: dentec-erp:latest
    container_name: dentec-erp
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "3000:3000"
    networks:
      - supabase

networks:
  supabase:
    external: true
    name: supabase_default
